
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今晚吃什麼？</title>
<style>
  :root {
    --bg: #faf7f0;
    --ink: #45443d;
    --accent: #71866b;
    --paper: #fffdf8;
    --muted: #8b897f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont,
      "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }

  main {
    width: min(100% - 32px, 900px);
    margin: 0 auto;
    padding: 40px 0;
  }

  header { text-align: center; margin-bottom: 28px; }

  .eyebrow {
    color: var(--accent);
    letter-spacing: 3px;
    font-size: 12px;
    font-weight: 700;
  }

  h1 { font-size: clamp(28px, 5vw, 42px); margin: 12px 0; }
  header p { color: var(--muted); font-size: 14px; }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(260px, .85fr);
    gap: 28px;
    align-items: start;
  }

  .panel {
    background: var(--paper);
    border: 1px solid #e9e3d7;
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 8px 30px #55482a0a;
  }

  .wheel-area {
    position: relative;
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
  }

  canvas { display: block; width: 100%; height: auto; }

  .pointer {
    position: absolute;
    z-index: 2;
    top: -7px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 17px solid transparent;
    border-right: 17px solid transparent;
    border-top: 35px solid #bd7355;
    filter: drop-shadow(0 2px 2px #0002);
  }

  button, input { font: inherit; }

  button {
    border: none;
    cursor: pointer;
    border-radius: 12px;
    transition: transform .15s, opacity .15s;
  }

  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .spin-btn {
    display: block;
    width: min(100%, 300px);
    margin: 20px auto 0;
    padding: 15px;
    background: var(--accent);
    color: white;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 2px;
  }

  .result {
    min-height: 66px;
    margin-top: 18px;
    padding: 14px;
    text-align: center;
    background: #f3f0e7;
    border-radius: 14px;
  }

  .result small { display: block; color: var(--muted); margin-bottom: 5px; }
  .result strong { font-size: 22px; color: #a45f43; }

  h2 { font-size: 19px; margin: 0 0 8px; }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.7; margin-bottom: 18px; }

  .add-row { display: flex; gap: 8px; }

  input {
    min-width: 0;
    flex: 1;
    padding: 12px;
    border: 1px solid #ded9ce;
    border-radius: 10px;
    background: white;
    color: var(--ink);
    outline-color: var(--accent);
  }

  .add-btn {
    padding: 0 16px;
    color: white;
    background: var(--accent);
    font-weight: 600;
  }

  .count {
    margin: 20px 0 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--muted);
  }

  .text-btn {
    color: #a45f43;
    background: transparent;
    padding: 4px;
    font-size: 13px;
  }

  .food-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-height: 280px;
    overflow-y: auto;
    align-content: flex-start;
  }

  .food-tag {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 10px;
    background: #f3f0e7;
    border-radius: 10px;
    font-size: 13px;
    max-width: 100%;
  }

  .food-tag span {
    overflow-wrap: anywhere;
  }

  .remove-btn {
    color: #a09a8e;
    background: transparent;
    font-size: 17px;
    padding: 0 2px;
    line-height: 1;
  }

  .remove-btn:hover { color: #b44c3d; }

  .bottom-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .secondary-btn {
    flex: 1;
    padding: 11px 8px;
    background: transparent;
    border: 1px solid #ded9ce;
    color: var(--ink);
    font-size: 13px;
  }

  footer {
    text-align: center;
    color: #9c978b;
    font-size: 12px;
    margin-top: 26px;
  }

  @media (max-width: 650px) {
    main { padding: 28px 0; }
    .layout { grid-template-columns: 1fr; gap: 18px; }
    .panel { padding: 18px; }
    .wheel-area { max-width: 360px; }
    header { margin-bottom: 22px; }
  }
</style>
</head>

<body>
<main>
  <header>
    <div class="eyebrow">TONIGHT'S DINNER</div>
    <h1>今晚吃什麼？</h1>
    <p>把選擇交給轉盤，今天就好好吃飯吧 🍜</p>
  </header>

  <div class="layout">
    <section class="panel">
      <div class="wheel-area">
        <div class="pointer"></div>
        <canvas id="wheel" width="600" height="600"
          aria-label="晚餐隨機轉盤"></canvas>
      </div>

      <button class="spin-btn" id="spinBtn">轉一轉！</button>

      <div class="result" aria-live="polite">
        <small id="resultLabel">今天的晚餐候選人是……</small>
        <strong id="resultText">等你來揭曉</strong>
      </div>
    </section>

    <section class="panel">
      <h2>我的晚餐清單</h2>
      <div class="hint">
        把你平常會吃的東西加進來。想吃什麼、附近有什麼，
        都可以放進轉盤裡！
      </div>

      <form id="addForm" class="add-row">
        <input id="foodInput" type="text"
          placeholder="例如：牛肉麵、壽司……"
          maxlength="30" autocomplete="off"
          aria-label="新增晚餐選項">
        <button class="add-btn" type="submit">＋ 新增</button>
      </form>

      <div class="count">
        <span>目前的選項</span>
        <span id="itemCount">0 個項目</span>
      </div>

      <div class="food-list" id="foodList"></div>

      <div class="bottom-actions">
        <button class="secondary-btn" id="resetBtn" type="button">
          ↺ 恢復預設清單
        </button>
        <button class="secondary-btn" id="clearBtn" type="button">
          清空清單
        </button>
      </div>
    </section>
  </div>

  <footer>Made for the eternal question: What should I eat tonight?</footer>
</main>

<script>
(() => {
  const DEFAULT_FOODS = [
    "滷肉飯", "牛肉麵", "水餃", "鍋貼",
    "日式拉麵", "壽司", "韓式料理", "越南河粉",
    "咖哩飯", "海南雞飯", "火鍋", "麻辣燙",
    "便當", "炒飯", "義大利麵", "披薩",
    "鹽酥雞", "滷味", "麥當勞", "便利商店"
  ];

  const COLORS = [
    "#D8A48F", "#E8C98F", "#A8B9A0", "#A9BBD0",
    "#D7B8C9", "#E6D8B8", "#B7C9C2", "#D9B5A4",
    "#B8A9CF", "#E4C5A6"
  ];

  const STORAGE_KEY = "dinner-wheel-foods-v1";
  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const spinBtn = document.getElementById("spinBtn");
  const foodInput = document.getElementById("foodInput");
  const foodList = document.getElementById("foodList");
  const resultText = document.getElementById("resultText");
  const resultLabel = document.getElementById("resultLabel");

  let foods = loadFoods();
  let rotation = 0;
  let spinning = false;
  let animationId = null;

  function loadFoods() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved !== null) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) {
          return parsed
            .filter(x => typeof x === "string")
            .map(x => x.trim())
            .filter(Boolean)
            .slice(0, 100);
        }
      }
    } catch (e) {}
    return [...DEFAULT_FOODS];
  }

  function saveFoods() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(foods));
    } catch (e) {}
  }

  function normalize(angle) {
    return ((angle % (Math.PI * 2)) + Math.PI * 2)
      % (Math.PI * 2);
  }

  function drawWheel() {
    const size = canvas.width;
    const center = size / 2;
    const radius = center - 12;

    ctx.clearRect(0, 0, size, size);

    if (foods.length === 0) {
      ctx.beginPath();
      ctx.arc(center, center, radius, 0, Math.PI * 2);
      ctx.fillStyle = "#eee9de";
      ctx.fill();
      ctx.fillStyle = "#777064";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "24px sans-serif";
      ctx.fillText("先新增晚餐選項", center, center);
      return;
    }

    const arc = Math.PI * 2 / foods.length;
    const fontSize = Math.max(
      11, Math.min(21, 220 / Math.max(foods.length, 10))
    );

    foods.forEach((food, i) => {
      const start = i * arc + rotation;
      const end = start + arc;

      ctx.beginPath();
      ctx.moveTo(center, center);
      ctx.arc(center, center, radius, start, end);
      ctx.closePath();
      ctx.fillStyle = COLORS[i % COLORS.length];
      ctx.fill();
      ctx.strokeStyle = "#fffdf8";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(start + arc / 2);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#403d35";
      ctx.font = `600 ${fontSize}px sans-serif`;

      let label = food;
      while (
        ctx.measureText(label).width > radius * 0.65 &&
        label.length > 2
      ) {
        label = label.slice(0, -1);
      }
      if (label !== food) label += "…";

      ctx.fillText(label, radius - 24, 0);
      ctx.restore();
    });

    // 中央圓點
    ctx.beginPath();
    ctx.arc(center, center, 28, 0, Math.PI * 2);
    ctx.fillStyle = "#fffdf8";
    ctx.fill();
    ctx.strokeStyle = "#d8d0c1";
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(center, center, 8, 0, Math.PI * 2);
    ctx.fillStyle = "#71866b";
    ctx.fill();
  }

  function renderList() {
    foodList.replaceChildren();

    foods.forEach((food, index) => {
      const tag = document.createElement("div");
      tag.className = "food-tag";

      const label = document.createElement("span");
      label.textContent = food;

      const remove = document.createElement("button");
      remove.className = "remove-btn";
      remove.type = "button";
      remove.textContent = "×";
      remove.setAttribute("aria-label", `刪除 ${food}`);
      remove.addEventListener("click", () => {
        if (spinning) return;
        foods.splice(index, 1);
        afterListChange();
        resultLabel.textContent = "清單已更新";
        resultText.textContent = "再看看今晚吃什麼？";
      });

      tag.append(label, remove);
      foodList.appendChild(tag);
    });

    document.getElementById("itemCount").textContent =
      `${foods.length} 個項目`;

    drawWheel();
  }

  function afterListChange() {
    saveFoods();
    renderList();
  }

  document.getElementById("addForm").addEventListener("submit", e => {
    e.preventDefault();
    if (spinning) return;

    const value = foodInput.value.trim();
    if (!value) {
      foodInput.focus();
      return;
    }

    if (foods.length >= 100) {
      resultLabel.textContent = "清單已達上限";
      resultText.textContent = "最多可加入 100 個項目";
      return;
    }

    if (foods.some(x => x.toLowerCase() === value.toLowerCase())) {
      resultLabel.textContent = "這個項目已經在清單裡囉";
      resultText.textContent = value;
      return;
    }

    foods.push(value);
    foodInput.value = "";
    afterListChange();
    resultLabel.textContent = "新增成功！";
    resultText.textContent = value;
    foodInput.focus();
  });

  spinBtn.addEventListener("click", () => {
    if (spinning) return;

    if (foods.length < 2) {
      resultLabel.textContent = "再多放一點選項吧";
      resultText.textContent = "至少需要 2 個項目";
      return;
    }

    spinning = true;
    spinBtn.disabled = true;
    spinBtn.textContent = "命運轉動中……";
    resultLabel.textContent = "今晚的答案即將揭曉";
    resultText.textContent = "轉呀轉呀轉！";

    const startRotation = rotation;
    const extraRotation =
      Math.PI * 2 * (5 + Math.random() * 4) +
      Math.random() * Math.PI * 2;
    const targetRotation = startRotation + extraRotation;
    const duration = 4200;
    const startTime = performance.now();

    function animate(now) {
      const elapsed = Math.min((now - startTime) / duration, 1);
      // easeOutCubic：慢慢減速，讓轉盤自然停下
      const eased = 1 - Math.pow(1 - elapsed, 3);

      rotation = startRotation + extraRotation * eased;
      drawWheel();

      if (elapsed < 1) {
        animationId = requestAnimationFrame(animate);
      } else {
        rotation = normalize(targetRotation);
        drawWheel();

        // 算出指針頂端所指向的扇形
        const arc = Math.PI * 2 / foods.length;
        const pointerAngle = normalize(-Math.PI / 2 - rotation);
        const selectedIndex = Math.floor(pointerAngle / arc);
        const selected = foods[selectedIndex];

        resultLabel.textContent = "🎉 今晚就決定是你了！";
        resultText.textContent = selected;
        spinBtn.disabled = false;
        spinBtn.textContent = "再轉一次！";
        spinning = false;
        animationId = null;
      }
    }

    animationId = requestAnimationFrame(animate);
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (spinning) return;
    foods = [...DEFAULT_FOODS];
    rotation = 0;
    afterListChange();
    resultLabel.textContent = "已恢復預設清單";
    resultText.textContent = "今晚吃什麼呢？";
  });

  document.getElementById("clearBtn").addEventListener("click", () => {
    if (spinning) return;
    foods = [];
    rotation = 0;
    afterListChange();
    resultLabel.textContent = "清單已清空";
    resultText.textContent = "新增你想吃的東西吧";
  });

  renderList();
})();
</script>
</body>
</html>
